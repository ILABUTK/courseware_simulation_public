# Conda environment for simdes courseware
# Usage:
#   conda env create -f environment/environment.yml
#   conda activate sim-course
#   jupyter lab

name: sim-course

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  # Core
  - numpy=1.26
  - scipy=1.13
  - pandas=2.2
  - matplotlib=3.9
  - seaborn=0.13

  # JupyterLab
  - jupyterlab=4.2
  - ipywidgets=8.1
  - nbformat=5.10

  # Testing / dev
  - pytest=8.2
  - pytest-cov=5.0

  - pip:
    - simpy==4.1.1
    - gymnasium==0.29.1
    - stable-baselines3==2.3.2
    - fitter==1.7.1
    - ruff==0.4.4
    - mypy==1.10.0
    - black==24.4.2
    # Install the simdes package in editable mode:
    - -e simdes/
