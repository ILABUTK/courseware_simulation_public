[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simdes"
version = "0.1.0"
description = "Discrete-event simulation models and analysis tools for 'Simulation Without a Black Box'"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Course Author", email = "author@example.com" }]

dependencies = [
    "simpy>=4.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
rl = [
    "stable-baselines3>=2.3",
    "torch>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "black>=24.0",
    "fitter>=1.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["simdes*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
strict = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=simdes --cov-report=term-missing"

[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
